output_dir: {{ project_root }}/pine_runs/{{ setting }}/{{ dataset }}
d: {{ dataset }}
type: {{ setting }}
time: {{ time_range }}
dataset:
  class: JointDataset
  graphs: [{{ dataset }}]
  raw_root: {{ project_root }}/dataset
  processed_root: {{ project_root }}/pine_data/processed

model:
  class: PINE
  relation_model:
    class: RelNBFNet
    input_dim: 64
    time_range: {{ time_range }}
    hidden_dims: [64, 64, 64, 64, 64, 64]
    message_func: rotate
    aggregate_func: sum
    short_cut: yes
    layer_norm: yes
  entity_model:
    class: EntityNBFNet
    input_dim: 64
    hidden_dims: [64, 64, 64, 64, 64, 64]
    message_func: rotate
    aggregate_func: sum
    short_cut: yes
    layer_norm: yes

task:
  name: TemporalCompletion
  num_negative: 128
  strict_negative: yes
  adversarial_temperature: 1
  metric: [mr, mrr, hits@1, hits@3, hits@10]

optimizer:
  class: AdamW
  lr: 1.0e-5

train:
  gpus: [0]
  batch_size: 16
  num_epoch: 10
  log_interval: 800
  batch_per_epoch: 80000
  fast_test: 500
